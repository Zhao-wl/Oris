function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function code(text) {

function writeBlockReason() {

}

      仓库会回到合并开始之前的状态，<span class="irrev">已在冲突文件中做的修改会丢失</span>（git merge --abort）。</div>
      <div class="foot"><button data-close>取消</button><button class="danger" data-close>中止合并</button></div></div>`;
  if (d === "stashsave") h = `<div class="dialog"><h3>储藏本地改动</h3><div class="body">
      <input type="text" placeholder="说明（可选）" value="WIP 登录表单校验">
      <label><input type="radio" name="r" checked> 全部改动（5 个文件）</label>
      <label><input type="radio" name="r"> 仅选中的 2 个文件</label>
      <label><input type="checkbox" checked> 包含未跟踪文件</label></div>
      <div class="foot"><button data-close>取消</button><button class="primary" data-close>储藏</button></div></div>`;
  return `<div class="overlay">${h}</div>`;
}
function toast() {
  if (state.toast === "discarded") return `<div class="toast">✓ 已丢弃 2 个文件的改动<button class="primary" data-act="undodiscard">撤销丢弃</button><button data-act="closetoast">✕</button></div>`;
  return "";
}

function setScenario(id) {
  timers.forEach(clearTimeout); timers = [];
  Object.assign(state, { scenario: id, scope: "unstaged", dialog: null, toast: null, popover: null, bottom: null, resolved: new Set(), verified: false, progress: 0, stagedExtra: [], discarded: false, optimistic: null, hunkDone: null });
  if (id === "branch") state.popover = "branch";
  if (id === "discard") state.dialog = "discard";
  if (id === "pullmenu") state.popover = "pullmenu";
  if (id === "merge") state.selected = "src/core/projectStore.ts";
  if (id === "stash") state.dialog = null;
  if (id === "progress") {
    state.progress = 18;
    const tick = () => { state.progress = Math.min(96, state.progress + 7); render(); if (state.progress < 96) timers.push(setTimeout(tick, 700)); };
    timers.push(setTimeout(tick, 700));
  }
  if (id === "verify") timers.push(setTimeout(() => { state.verified = true; render(); }, 4000));
  render();
}

document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-file]");
  if (!t) { if (state.popover && !e.target.closest(".pop")) { state.popover = null; render(); } return; }
  if (t.disabled) return;
  if (t.dataset.sc) return setScenario(t.dataset.sc);
  if (t.hasAttribute("data-theme")) { state.theme = state.theme === "dark" ? "light" : "dark"; return render(); }
  if (t.hasAttribute("data-close")) { state.dialog = null; return render(); }
  if (t.dataset.scope) { state.scope = t.dataset.scope; return render(); }
  if (t.dataset.stage) {
    const p = t.dataset.stage; state.optimistic = p; render();
    timers.push(setTimeout(() => { state.optimistic = null; state.stagedExtra.push(p); render(); }, 600));
    return;
  }
  if (t.dataset.hunk) { state.hunkDone = Number(t.dataset.hunk); return render(); }
  if (t.dataset.resolve) {
    const p = t.dataset.resolve;
    if (p === "src/core/projectStore.ts" && !state.resolved.has(p)) { state.dialog = "marker"; return render(); }
    state.resolved.add(p); return render();
  }
  const act = t.dataset.act;
  if (act === "branch") { state.popover = state.popover === "branch" ? null : "branch"; return render(); }
  if (act === "pullmenu") { state.popover = state.popover === "pullmenu" ? null : "pullmenu"; return render(); }
  if (act === "discard") { state.dialog = "discard"; return render(); }
  if (act === "dodiscard") { state.dialog = null; state.discarded = true; state.toast = "discarded"; return render(); }
  if (act === "undodiscard") { state.discarded = false; state.toast = null; return render(); }
  if (act === "closetoast") { state.toast = null; return render(); }
  if (act === "checkoutblocked") { state.popover = null; state.dialog = "checkoutblocked"; return render(); }
  if (act === "forceresolve") { state.resolved.add("src/core/projectStore.ts"); state.dialog = null; return render(); }
  if (act === "abortmerge") { state.dialog = "abortmerge"; return render(); }
  if (act === "stashsave") { state.dialog = "stashsave"; return render(); }
  if (t.dataset.file && !e.target.closest("button, input")) { state.selected = t.dataset.file; return render(); }
});

const params = new URLSearchParams(location.search);
if (params.get("theme") === "light") state.theme = "light";
setScenario(params.get("s") || "daily");
</script>
</body>
