<style>
*{box-sizing:border-box}body{margin:0;background:#121316;color:#d5d7dc;font:13px/1.45 "Segoe UI","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;background:#17191d;border-bottom:1px solid #383b40}.top strong{font-size:14px}.top .hint{color:#9b9ea8}.top .scenes{display:flex;gap:5px;flex-wrap:wrap}.top button{border:1px solid #42464d;background:#282b30;color:inherit;border-radius:5px;padding:5px 10px}.top button.active{background:#365b9d;border-color:#668fdb;color:#fff}.top .space{flex:1}.note{margin:12px 18px 0;padding:7px 11px;border-left:3px solid #6c9df2;background:#242b39;color:#c7d3e9}.shell{--bg:#1e1f22;--panel:#2b2d30;--chrome:#26272b;--text:#bcbec4;--sub:#92959e;--border:#393b40;--hover:#334a74;--blue:#79a8f8;--bluebg:#263f61;--mod:#283d53;--modword:#42678e;--add:#294436;--addword:#3f7251;--del:#3c3f41;--warn:#e0a23b;--warnbg:#40331f;--danger:#ed7777;--dangerbg:#482b2d;--ok:#81bd83;position:relative;margin:14px 18px 26px;height:790px;min-width:1060px;border:1px solid #50535a;border-radius:8px;overflow:hidden;display:grid;grid-template-rows:42px 49px minmax(0,1fr) auto 25px;background:var(--bg);color:var(--text)}.shell.light{--bg:#fff;--panel:#f7f8fa;--chrome:#ebedf2;--text:#25272d;--sub:#717781;--border:#d9dce2;--hover:#dbe8ff;--blue:#315ee7;--bluebg:#e3edff;--mod:#e2edfb;--modword:#b3d2fa;--add:#e2f2df;--addword:#b5dca8;--del:#e7e7e8;--warn:#906000;--warnbg:#fff1cc;--danger:#b5232d;--dangerbg:#ffe2e4;--ok:#28702d}.shell button,.shell input,.shell textarea{color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:4px}.shell button{padding:4px 8px}.shell button:hover{background:var(--hover)}.shell button:focus-visible,.top button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}.shell .primary{background:#315ee7;border-color:#315ee7;color:#fff}.shell .quiet{background:transparent}.shell .danger{color:var(--danger)}.shell .muted{color:var(--sub)}.shell .space{flex:1}.title,.projects,.side-head,.scope,.filter-row,.diff-head,.diff-tools,.endpoints,.git-tabs,.status{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}.title{background:var(--chrome);padding:0 11px}.logo{display:grid;place-items:center;width:24px;height:24px;border-radius:5px;background:#7165d3;color:#fff;font-weight:700}.title .name{font-weight:600}.vcs{display:flex;align-items:center;gap:7px;min-width:0}.vcs .counts{font-size:11px;color:var(--blue)}.projects{background:var(--chrome);padding:5px 8px;overflow:hidden}.projects>button{white-space:nowrap}.projects input{width:185px;padding:5px 8px}.ptab{min-width:164px;width:164px;height:37px;padding:4px 8px;border:1px solid var(--border);border-radius:5px;background:var(--panel);font-size:12px;line-height:1.15;overflow:hidden}.ptab.active{border-color:var(--blue);box-shadow:inset 0 -2px 0 var(--blue)}.ptab small{display:block;color:var(--sub);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.main{display:grid;grid-template-columns:318px 6px minmax(0,1fr);min-height:0}.divider{background:var(--chrome);border-right:1px solid var(--border);border-left:1px solid var(--border)}.side{display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;min-height:0;background:var(--panel)}.side-head{padding:9px 10px}.side-head span{font-size:11px;color:var(--sub)}.scope{padding:6px 8px;gap:4px}.scope button{flex:1;padding:5px 3px}.scope button.active,.git-tabs button.active{background:var(--bluebg);border-color:var(--blue);color:var(--text)}.filter-row{padding:0 8px 7px}.filter-row input{width:100%;padding:5px 8px}.files{overflow:auto}.group{padding:9px 10px 4px;font-size:11px;color:var(--sub);font-weight:600}.file{display:flex;align-items:center;gap:6px;min-height:29px;padding:3px 7px 3px 10px}.file.selected{background:var(--hover)}.file input{margin:0 2px 0 0}.file .mark{width:12px;font-weight:700;color:var(--blue)}.file .mark.add{color:var(--ok)}.file .path{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.file .stat{color:var(--sub);font:11px Consolas,monospace}.file button{font-size:11px;white-space:nowrap;padding:2px 5px}.side-foot{padding:6px 10px;border-top:1px solid var(--border);font-size:11px;color:var(--sub);display:flex;align-items:center;gap:6px}.editor{display:grid;grid-template-rows:auto auto auto minmax(0,1fr);min-width:0;min-height:0}.editor:has(.banner.show){grid-template-rows:auto auto auto auto minmax(0,1fr)}.banner{display:none;align-items:center;gap:8px;padding:7px 11px;background:var(--warnbg);border-bottom:1px solid var(--border);color:var(--warn)}.banner.show{display:flex}.banner.danger{background:var(--dangerbg);color:var(--danger)}.diff-head{min-height:38px;padding:0 10px}.diff-head strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.diff-tools{padding:4px 8px;background:var(--chrome);font-size:11px;flex-wrap:wrap}.diff-tools button{padding:2px 6px}.endpoints{display:grid;grid-template-columns:1fr 27px 1fr;padding:0 21px 0 24px;font-size:11px;color:var(--sub);min-height:25px}.endpoints span:last-child{padding-left:7px}.diff{overflow:auto;min-height:0;background:var(--bg)}.code-row,.hunk-title{display:grid;grid-template-columns:minmax(0,1fr) 27px minmax(0,1fr)}.code-row{min-height:22px;font:12px/22px Consolas,"Microsoft YaHei",monospace}.code-row .cell{display:flex;white-space:pre;overflow:hidden}.code-row .ln{display:inline-block;width:35px;flex:0 0 35px;text-align:right;padding-right:8px;color:var(--sub);user-select:none}.code-row .text{overflow:hidden;text-overflow:clip}.code-row .gap,.hunk-title .gap{background:var(--chrome);border-left:1px solid var(--border);border-right:1px solid var(--border)}.code-row.mod .cell{background:var(--mod)}.code-row.add .right{background:var(--add)}.code-row.del .left{background:var(--del)}.word.mod{background:var(--modword)}.word.add{background:var(--addword)}.hunk-title{background:var(--chrome);border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-size:11px;color:var(--sub);min-height:29px}.hunk-title .label{padding:6px 8px 4px 12px}.hunk-title .actions{display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:3px 8px}.hunk-title button{padding:2px 6px;font-size:11px}.diff-empty{padding:18px;color:var(--sub)}.git{min-height:34px;background:var(--panel);border-top:1px solid var(--border)}.git.open{height:188px;display:grid;grid-template-rows:34px minmax(0,1fr)}.git-tabs{height:34px;padding:0 8px;gap:4px}.git-tabs button{border:0;background:transparent;border-radius:0;height:29px}.git-tabs .fold{margin-left:auto}.git-body{padding:10px 12px;overflow:auto}.commit-layout{display:grid;grid-template-columns:minmax(280px,1fr) 240px;gap:12px;height:100%}.commit-layout textarea{width:100%;height:91px;padding:8px;resize:none}.commit-right{display:flex;flex-direction:column;gap:7px}.commit-right small{color:var(--sub)}.commit-right label{display:flex;align-items:center;gap:5px}.commit-right .buttons{display:flex;gap:5px;align-items:center}.log-row,.stash-row{padding:5px 6px;border-bottom:1px solid var(--border)}.log-row em{color:var(--sub);font-style:normal;margin-right:15px}.stash-row{display:flex;align-items:center;gap:10px}.stash-row.selected{background:var(--hover)}.stash-row .text{flex:1}.stash-row small{display:block;color:var(--sub)}.stash-row button{padding:2px 6px}.status{border-bottom:0;background:var(--chrome);padding:0 9px;font-size:11px;color:var(--sub)}.status .ok{color:var(--ok)}.popover{position:absolute;z-index:5;top:39px;width:345px;background:var(--panel);border:1px solid var(--border);box-shadow:0 10px 28px #0009;padding:10px;border-radius:5px}.popover.branch{left:90px}.popover.sync{left:250px;width:265px}.popover input{width:100%;padding:6px 8px;margin:4px 0 8px}.popover .pop-group{font-size:11px;color:var(--sub);padding:7px 3px 3px}.popover .pop-row{display:flex;align-items:center;gap:7px;padding:5px 3px;border-top:1px solid var(--border)}.popover .pop-row span{flex:1}.popover .pop-row button{padding:2px 6px;font-size:11px}.overlay{position:absolute;inset:0;z-index:8;background:#0009;display:grid;place-items:center}.dialog{width:460px;background:var(--panel);border:1px solid var(--border);box-shadow:0 15px 40px #000a;padding:16px;border-radius:7px}.dialog h3{margin:0 0 10px;font-size:15px}.dialog p{line-height:1.6}.dialog .footer{display:flex;gap:7px;justify-content:flex-end;margin-top:14px}.dialog label{display:block;margin:8px 0}.dialog input[type=text]{width:100%;padding:6px}.small{font-size:11px;color:var(--sub)}.light-page{background:#e9ebf0;color:#25272d}.light-page .top{background:#fff;border-color:#ccc}.light-page .top button{background:#f5f6f8;color:#25272d;border-color:#cdd1d8}.light-page .top button.active{background:#315ee7;color:#fff}.light-page .note{background:#e4ecfb;color:#244374}.light-page .shell{border-color:#bbc0c8}@media(max-width:1100px){body{overflow-x:auto}}
</style>
</head>
<body>
<div class="top"><strong>Oris · 混合发布参考</strong><span class="hint">交互示意 / 示例数据</span><div class="scenes" id="scenes"></div><span class="space"></span><button id="theme">浅色 / 深色</button></div>
<div class="note" id="note"></div><div class="shell" id="shell"></div>
<script>
const scenes={review:{label:'日常查看',note:'日常只保留文件列表和大面积 Diff；提交表单按需展开。三个比较范围继续决定 Diff 两端。'},commit:{label:'提交任务',note:'打开底部“提交”页后填写草稿、amend，并确认只提交暂存区；文件列表与主 Diff 仍可同时查看。'},branch:{label:'分支与同步',note:'当前分支及收发计数持续可见；分支和同步分别展开，Pull 与 Push 再进入确认界面。'},merge:{label:'合并冲突',note:'持久横幅说明进行中状态；冲突版本在主 Diff 中只读查看，文件列表负责“标记已解决”。'},stash:{label:'Stash',note:'Stash 位于底部 Git 区；选中内容文件继续进入同一个主 Diff 阅读器。'}};
const files=[{path:'src/core/projectStore.ts',kind:'M',stat:'+18 −6',staged:false},{path:'src/git/remote.ts',kind:'M',stat:'+22 −3',staged:false},{path:'docs/notes/临时草稿.md',kind:'U',stat:'+9',staged:false},{path:'src/login/form.tsx',kind:'A',stat:'+64',staged:true},{path:'src/api.ts',kind:'M',stat:'+7 −2',staged:true}];
const state={scene:'review',scope:'unstaged',theme:'dark',bottom:null,pop:null,dialog:null,selected:files[0].path};
const el=id=>document.getElementById(id);const escapeHtml=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function btn(text,action,cls=''){return `<button type="button" class="${cls}" data-action="${action}">${text}</button>`}
function fileRow(f){const staged=f.staged;const conflict=state.scene==='merge';return `<div class="file ${state.selected===f.path?'selected':''}"><input type="checkbox" aria-label="批量选择 ${escapeHtml(f.path)}"><span class="mark ${f.kind==='A'?'add':''}">${conflict?'!':f.kind}</span><span class="path" data-file="${escapeHtml(f.path)}" title="${escapeHtml(f.path)}">${escapeHtml(f.path)}</span><span class="stat">${f.stat}</span>${conflict?btn('标记解决','resolved'):state.scope==='all'?'':btn(staged?'取消暂存':'暂存',staged?'unstage':'stage')}</div>`}
function sidebar(){let shown=state.scene==='merge'?[{path:'src/login/form.tsx',kind:'C',stat:'冲突',staged:false},{path:'src/api.ts',kind:'C',stat:'冲突',staged:false}]:files.filter(f=>state.scope==='all'||f.staged===(state.scope==='staged'));return `<aside class="side"><div class="side-head"><strong>变更</strong><span class="space"></span><span>已暂存 2 · 未暂存 3</span></div><div class="scope">${[['unstaged','未暂存'],['staged','已暂存'],['all','全部']].map(([id,label])=>btn(label,'scope:'+id,state.scope===id?'active':'')).join('')}</div><div class="filter-row"><input aria-label="按完整路径筛选" placeholder="按完整相对路径筛选"></div><div class="files"><div class="group">${state.scene==='merge'?'冲突文件 · 2':state.scope==='staged'?'已暂存 · 2':state.scope==='all'?'全部变化 · 5':'未暂存 · 3'}</div>${shown.map(fileRow).join('')}</div><div class="side-foot"><span>☑ 仅用于批量选择</span><span class="space"></span>${btn('批量操作 ▾','batch','quiet')}</div></aside>`}
function codeRow(kind,leftNo,left,rightNo,right){return `<div class="code-row ${kind}"><div class="cell left"><span class="ln">${leftNo||''}</span><span class="text">${left||''}</span></div><div class="gap"></div><div class="cell right"><span class="ln">${rightNo||''}</span><span class="text">${right||''}</span></div></div>`}
function hunk(title){let acts=state.scene==='merge'||state.scope==='all'?'<span class="small">只读比较</span>':state.scope==='staged'?btn('取消暂存此块','hunk'):btn('暂存此块','hunk')+btn('丢弃此块','discard','danger');return `<div class="hunk-title"><span class="label">${title}</span><span class="gap"></span><span class="actions">${acts}</span></div>`}
function editor(){let conflict=state.scene==='merge';let banner=conflict?`<div class="banner danger show"><strong>合并进行中 · 2 个冲突</strong><span class="space"></span>${btn('查看冲突','noop')}${btn('中止合并…','abort','danger')}</div>`:'';let endpoints=conflict?['stage 2 · 当前分支（ours）','stage 3 · 目标分支（theirs）']:state.scope==='staged'?['HEAD','Index（暂存区）']:state.scope==='all'?['HEAD','Working Tree（工作区）']:['Index（暂存区）','Working Tree（工作区）'];return `<section class="editor">${banner}<div class="diff-head"><strong>${escapeHtml(state.selected)}</strong><span class="space"></span><span class="muted">${conflict?'冲突版本 · 只读':'4 处差异'}</span></div><div class="diff-tools">${btn('↑','noop')}${btn('↓','noop')}<span>1 / 4</span>${btn('并排视图 ▾','noop')}${btn('按词高亮 ▾','noop')}${btn('折叠上下文','noop')}${btn('自动换行','noop')}${btn('对齐变化','noop')}<span class="space"></span><span>字号 13</span></div><div class="endpoints"><span>${endpoints[0]}</span><span></span><span>${endpoints[1]}</span></div><div class="diff">${codeRow('',1,'import type { Project } from "./types";',1,'import type { Project } from "./types";')}${codeRow('',2,'',2,'')}${hunk('@@ -3,7 +3,8 @@ · 类型声明')}${codeRow('mod',3,'type ProjectEntry = Project;',3,'type ProjectEntry = Project & StoredWorkspace;')}${codeRow('',4,'export function loadProjects() {',4,'export function loadProjects() {')}${codeRow('mod',5,'  const parsed = JSON.parse(raw);',5,'  const parsed = safeParse(raw);')}${codeRow('',6,'  return parsed;',6,'  return parsed;')}${codeRow('',7,'}',7,'}')}${codeRow('',8,'',8,'')}${hunk('@@ -10,0 +11,3 @@ · 新增校验')}${codeRow('add','','',11,'  if (!Array.isArray(parsed)) return [];')}${codeRow('add','','',12,'  return parsed.filter(isProject);')}${codeRow('add','','',13,'')}${codeRow('',14,'export const KEY = "oris.projects";',17,'export const KEY = "oris.projects";')}${codeRow('',15,'',18,'')}</div></section>`}
function bottom(){let open=!!state.bottom;let tabs=[['log','Git 日志'],['commit','提交'],['stash','Stash'],['output','操作输出']];let body=state.bottom==='commit'?`<div class="commit-layout"><textarea aria-label="提交信息" placeholder="提交摘要（必填）\n\n详细说明…"></textarea><div class="commit-right"><strong>提交暂存区 · 2 个文件</strong><small>草稿按项目保存；未暂存内容不会进入提交</small><label><input type="checkbox"> 修订最近一次提交（amend）</label><div class="buttons">${btn('提交','commitnow','primary')}${btn('提交并推送…','push')}</div><small>${btn('撤销最近提交…','undo','quiet')}</small></div></div>`:state.bottom==='stash'?`<div class="stash-row selected"><span class="text">stash@{0} · WIP 登录表单校验<small>feature/login · 3 个文件 + 1 个未跟踪 · 10 分钟前</small></span>${btn('查看文件','stashfile')}${btn('应用','apply')}${btn('弹出','pop')}${btn('删除…','drop','danger')}</div><div class="stash-row"><span class="text">stash@{1} · 临时调试日志<small>main · 2 天前 · 1 个文件</small></span></div>`:state.bottom==='output'?`<div class="small">最近操作输出在此展示；失败时保留 Git 错误摘要与可采取的下一步。</div>`:`<div class="log-row"><em>3f2a1c9</em> fix: diff scroll sync <span class="small">· feature/diff-viewer</span></div><div class="log-row"><em>8a7b5e2</em> feat: project workspace</div>`;return `<section class="git ${open?'open':''}"><div class="git-tabs">${tabs.map(([id,label])=>btn(label,'bottom:'+id,state.bottom===id?'active':'')).join('')}<span class="space"></span>${btn(open?'收起 ↑':'展开 ↓','togglebottom','fold')}</div>${open?`<div class="git-body">${body}</div>`:''}</section>`}
function popup(){if(!state.pop)return '';if(state.pop==='branch')return `<div class="popover branch"><strong>分支</strong><input placeholder="搜索分支" aria-label="搜索分支"><div class="pop-row"><span>＋ 新建分支…</span>${btn('打开','newbranch')}</div><div class="pop-group">当前 / 最近</div><div class="pop-row"><span>● feature/diff-viewer</span><small>当前</small></div><div class="pop-group">本地分支</div><div class="pop-row"><span>main</span>${btn('切换','switch')}${btn('更多 ▾','branchmore')}</div><div class="pop-row"><span>feature/login</span>${btn('切换','switch')}${btn('更多 ▾','branchmore')}</div><div class="pop-group">远端跟踪分支</div><div class="pop-row"><span>origin/main</span>${btn('检出','switch')}</div></div>`;return `<div class="popover sync"><strong>同步当前分支</strong><div class="small">origin/feature/diff-viewer · ↓2 ↑1</div><div class="pop-row"><span>获取远端状态</span>${btn('获取','fetch')}</div><div class="pop-row"><span>拉取到当前分支</span>${btn('选项…','pull')}</div><div class="pop-row"><span>推送当前分支</span>${btn('预览…','push')}</div></div>`}
function modal(){if(!state.dialog)return '';const map={switch:['切换分支','当前工作区改动会阻止切换到 main。可以先储藏当前改动，切换后由你决定何时恢复。','stash 后切换'],pull:['拉取当前分支','来源：origin/feature/diff-viewer（落后 2 个提交）。策略：仅快进（默认）或合并远端改动。','确认拉取'],push:['推送预览','目标：origin/feature/diff-viewer。将推送当前分支领先的 1 个提交；此处不包含 tag，也没有强制推送。','确认推送'],discard:['丢弃此块','这会丢弃当前 hunk 的未暂存改动。执行前会创建可撤销备份；若超出备份预算，将明确标注不可撤销。','确认丢弃'],batch:['批量操作','勾选只决定批量目标，不会自动暂存。可选择暂存、取消暂存、丢弃或储藏。','关闭'],resolved:['标记已解决','暂存此冲突文件以标记解决；如果仍含冲突标记，将先显示警告。','确认'],abort:['中止合并','中止当前合并前需要确认；主 Diff 的冲突查看始终只读。','确认'],drop:['删除 Stash','删除前核对 stash 身份，并二次确认。','确认删除'],commitnow:['提交暂存区','只提交已暂存的 2 个文件。此图不会执行真实 Git 命令。','关闭'],fetch:['获取远端状态','将更新本地远端引用，不修改工作区内容。此图不会执行真实 Git 命令。','关闭'],hunk:['块操作','此操作只作用于当前 hunk；成功后重新读取未暂存与已暂存范围。','关闭'],newbranch:['新建分支','从当前 HEAD、新选择的分支或提交创建；可选择是否立即切换。','关闭'],undo:['撤销最近提交','HEAD 回退一个提交，改动回到暂存区，工作区不变。','关闭'],apply:['应用 Stash','应用后保留此条 Stash；若出现冲突，进入只读冲突查看。','关闭'],pop:['弹出 Stash','应用成功后删除此条 Stash；出现冲突时保留。','关闭'],branchmore:['分支操作','这里提供合并、重命名、删除和设置上游等上下文操作。','关闭']};const [title,body,action]=map[state.dialog]||['操作示意','该操作在正式应用中会展示结果。','关闭'];return `<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="${title}"><h3>${title}</h3><p>${body}</p>${state.dialog==='pull'?'<label><input type="radio" name="pull" checked> 仅快进（默认）</label><label><input type="radio" name="pull"> 合并远端改动</label>':''}<div class="footer">${btn('取消','close')}${btn(action,'close','primary')}</div></div></div>`}
function render(){el('scenes').innerHTML=Object.entries(scenes).map(([id,s])=>`<button data-scene="${id}" class="${state.scene===id?'active':''}">${s.label}</button>`).join('');el('note').textContent=scenes[state.scene].note;document.body.classList.toggle('light-page',state.theme==='light');el('shell').className='shell'+(state.theme==='light'?' light':'');el('shell').innerHTML=`<header class="title"><span class="logo">O</span><strong class="name">Oris</strong><div class="vcs">${btn('⑂ feature/diff-viewer ▾','branch')}<span class="counts" title="相对上游">↓2 ↑1</span>${btn('同步 ▾','sync')}</div><span class="space"></span>${btn('提交 · 2','bottom:commit')}${btn('☀ / ☾','theme')}</header><div class="projects">${btn('添加项目','noop','primary')}<input placeholder="搜索项目或完整路径" aria-label="搜索项目"><div class="ptab active">Oris<small>D:\\Projects\\Research\\Oris</small></div><div class="ptab">UI Lab<small>D:\\Projects\\Research\\UI-Lab</small></div></div><main class="main">${sidebar()}<div class="divider"></div>${editor()}</main>${bottom()}<footer class="status"><span>D:\\Projects\\Research\\Oris · ${state.scope==='unstaged'?'未暂存':state.scope==='staged'?'已暂存':'全部'}</span><span class="space"></span><span class="ok">示例界面 · 无真实 Git 操作</span></footer>${popup()}${modal()}`}
document.addEventListener('click',e=>{const t=e.target.closest('[data-scene],[data-action],#theme,[data-file]');if(!t)return;if(t.id==='theme'){state.theme=state.theme==='dark'?'light':'dark';return render()}if(t.dataset.scene){state.scene=t.dataset.scene;state.scope='unstaged';state.bottom=t.dataset.scene==='commit'?'commit':t.dataset.scene==='stash'?'stash':null;state.pop=t.dataset.scene==='branch'?'branch':null;state.dialog=null;return render()}if(t.dataset.file){state.selected=t.dataset.file;return render()}const a=t.dataset.action;if(!a)return;if(a==='theme'){state.theme=state.theme==='dark'?'light':'dark'}else if(a.startsWith('scope:'))state.scope=a.split(':')[1];else if(a.startsWith('bottom:'))state.bottom=a.split(':')[1];else if(a==='togglebottom')state.bottom=state.bottom?null:'log';else if(a==='branch'||a==='sync')state.pop=state.pop===a?null:a;else if(a==='close')state.dialog=null;else if(a!=='noop'&&a!=='stage'&&a!=='unstage'&&a!=='stashfile')state.dialog=a;if(a==='stage'||a==='unstage')state.dialog='hunk';if(a==='stashfile')state.selected='src/login/form.tsx';render()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){state.pop=null;state.dialog=null;render()}});render();
</script>
</body></html>
