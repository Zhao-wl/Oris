<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const data=[['A','Assets/Football/Editor/BatchBuild/AndroidPackageBatchEntry.cs',17],['A','Assets/Football/Editor/BatchBuild/AndroidPackageBatchEntry.cs.meta',11],['M','Assets/Football/Runtime/Application/Session/MatchApplicationHost.cs',28],['M','Assets/Football/Editor/Diagnostics/AiScaleComparisonWindow.cs',46],['A','Assets/Football/Tests/EditMode/Application/Session/MatchApplicationHostTests.cs',64],['M','Assets/Football/Tests/PlayMode/Application/Session/MatchApplicationHostTests.cs',21],['M','Docs/二期/比赛表现与调试/比赛回放速度与逻辑步进验收记录.md',32]];

let staged=new Set([2,3]),selected=0,mode='files',commitIndex=0,collapsed=false,height=330;
function notify(text){$('toast').textContent=text;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').textContent='',2200);}
function rows(ids,target,history=false){$(target).innerHTML=ids.map(i=>{const [s,p,a]=data[i],cut=p.lastIndexOf('/')+1;return '<div class="filerow '+(i===selected?'selected':'')+'" tabindex="0" role="button" data-file="'+i+'" title="'+esc(p)+'"><span class="status">'+s+'</span><span class="filetext"><span class="directory">'+esc(p.slice(0,cut))+'</span><span class="filename">'+esc(p.slice(cut))+'</span></span><span class="stats">+'+a+'</span>'+(history?'':'<button class="icon rowact" data-move="'+i+'" title="'+(staged.has(i)?'取消暂存':'暂存')+'" aria-label="'+(staged.has(i)?'取消暂存':'暂存')+'">'+(staged.has(i)?'−':'+')+'</button>')+'</div>';}).join('')||'<div class="empty">'+(target==='staged'?'暂无已暂存文件':'暂无文件')+'</div>';}

function renderHistory(){const ids=commitIndex===0?[2,3,4,5,6]:commitIndex%2?[0,1,4]:[2,5,6];rows(ids,'historyFiles',true);$('historyCount').textContent=ids.length;$('commitHash').textContent=hashes[commitIndex];$('commits').innerHTML=commits.map((c,i)=>({c,i})).filter(({c})=>c.includes($('commitSearch').value)).map(({c,i})=>'<button class="commitrow '+(i===commitIndex?'selected':'')+'" data-commit="'+i+'"><span class="graph">'+(i%3?'│ ●':'●')+'</span><span class="msg">'+(i===0?'HEAD · ':'')+esc(c)+'</span><span class="date">2026/11/06 16:01</span><span class="hash">'+hashes[i]+'</span></button>').join('');}

document.addEventListener('click',e=>{const move=e.target.closest('[data-move]');if(move){const i=+move.dataset.move;staged.has(i)?staged.delete(i):staged.add(i);render();return;}const row=e.target.closest('[data-file]');if(row){selected=+row.dataset.file;render();}const c=e.target.closest('[data-commit]');if(c){commitIndex=+c.dataset.commit;selected=commitIndex===0?2:commitIndex%2?0:2;render();}});
document.addEventListener('keydown',e=>{if(e.target.matches('.filerow')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.click();}});
function setMode(next){mode=next;for(const name of ['files','history']){$(name+'Panel').hidden=name!==mode;$(name+'Tab').classList.toggle('active',name===mode);$(name+'Tab').setAttribute('aria-selected',name===mode);}if(mode==='history')selected=commitIndex===0?2:commitIndex%2?0:2;if(collapsed)toggleCollapse();render();}
$('filesTab').onclick=()=>setMode('files');$('historyTab').onclick=()=>setMode('history');$('stageAll').onclick=()=>{staged=new Set(data.map((_,i)=>i));render();};$('unstageAll').onclick=()=>{staged.clear();render();};$('summary').oninput=render;$('commitSearch').oninput=renderHistory;

function setHeight(value){height=Math.max(170,Math.min(window.innerHeight-190,value));if(!collapsed)$('lower').style.height=height+'px';try{localStorage.setItem('oris-bottom-panel-height',height);}catch{}}
try{const saved=Number(localStorage.getItem('oris-bottom-panel-height'));if(saved)height=saved;}catch{}setHeight(height);
function toggleCollapse(){collapsed=!collapsed;$('lower').style.height=collapsed?'32px':height+'px';$('collapse').textContent=collapsed?'⌃':'⌄';$('collapse').title=collapsed?'展开下方区域':'收起下方区域';$('collapse').setAttribute('aria-label',$('collapse').title);$('filesPanel').hidden=collapsed||mode!=='files';$('historyPanel').hidden=collapsed||mode!=='history';}
$('collapse').onclick=toggleCollapse;
$('resize').onpointerdown=e=>{if(collapsed)toggleCollapse();const y=e.clientY,start=height;$('resize').setPointerCapture(e.pointerId);$('resize').classList.add('dragging');$('resize').onpointermove=ev=>setHeight(start+y-ev.clientY);};
function endDrag(){$('resize').onpointermove=null;$('resize').classList.remove('dragging');}$('resize').onpointerup=endDrag;$('resize').onpointercancel=endDrag;$('resize').onkeydown=e=>{if(['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();if(collapsed)toggleCollapse();setHeight(height+(e.key==='ArrowUp'?20:-20));}};window.addEventListener('resize',()=>setHeight(height));
$('addProject').onclick=()=>$('projectDialog').showModal();$('closeDialog').onclick=()=>$('projectDialog').close();$('confirmProject').onclick=()=>{if(!$('projectPath').value.trim())return;notify('示例：通过 + 添加项目');$('projectDialog').close();};$('refresh').onclick=()=>notify('已刷新示例数据');$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(data[selected][1]);notify('路径已复制');}catch{notify('请选中上方路径复制');}};
