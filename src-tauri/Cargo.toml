[package]
name = "oris"
version = "0.1.0"
description = "Read-only Git change viewer"
authors = ["Oris contributors"]
edition = "2021"

[lib]
name = "oris_lib"
crate-type = ["rlib"]

[features]
default = ["desktop"]
desktop = ["dep:notify", "dep:tauri", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
base64 = "0.22.1"
dunce = "1.0.5"
hex = "0.4.3"
notify = { version = "8.2.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
tauri = { version = "2.11.6", features = [], optional = true }
tauri-plugin-dialog = { version = "2.7.3", optional = true }
thiserror = "2.0.17"

[dev-dependencies]
tempfile = "3.23.0"
