name: Windows release
run-name: Windows ${{ inputs.mode }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: check 只构建验证，publish 正式发布
        type: choice
        options: [check, publish]
        default: check
      version:
        description: 正式发布版本号（x.y.z）；check 可留空
        type: string
      notes:
        description: 正式发布说明
        type: string

permissions:
  contents: write

concurrency:
  group: oris-windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: 检查发布参数与签名配置
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:MODE -eq 'publish') {
            if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw '版本号必须为 x.y.z' }
            $current = (Get-Content package.json -Raw | ConvertFrom-Json).version
            if ([version]$env:VERSION -le [version]$current) { throw "新版本必须大于 $current" }
            if ([string]::IsNullOrWhiteSpace($env:NOTES)) { throw '正式发布必须提供更新说明' }
            if (-not $env:SIGNING_KEY -or -not $env:SIGNING_PASSWORD) { throw '请配置原有更新签名私钥和口令 Secrets' }
            if (git tag --list "v$env:VERSION") { throw '版本 tag 已存在' }
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: 配置 Rust MSVC 工具链与 Git 提交身份
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust 安装失败' }
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust 工具链配置失败' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: 安装依赖并预取许可证所需的跨平台 Cargo 包
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci 失败' }
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo fetch 失败' }
      - name: 测试与无签名构建验证
        if: inputs.mode == 'check'
        run: |
          npx vitest run --no-file-parallelism
          if ($LASTEXITCODE -ne 0) { throw '测试失败' }
          & ./scripts/build-release.ps1 -Bundle -Bundles nsis
      - name: 签名构建与正式发布
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          $notesPath = Join-Path $env:RUNNER_TEMP 'oris-release-notes.md'
          [IO.File]::WriteAllText($notesPath, $env:RELEASE_NOTES, [Text.UTF8Encoding]::new($false))
          & ./scripts/publish-release.ps1 -Version $env:RELEASE_VERSION -NotesFile $notesPath
      - name: 保存构建产物（check 产物仅供验证，不能用于自动更新）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error
          retention-days: 14
