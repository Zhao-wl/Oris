restore(window.openai?.widgetState?.privateContent);function view(){const v=state.views[state.project]??={scope:'work',file:0,hunk:0,commit:0,branch:'all',history:false};return v;}function save(){window.openai?.setWidgetState?.({modelContent:{design:'JetBrains-inspired v2',project:data[state.project].name,diffLayout:state.mode,focusDiff:state.focus,gitLog:state.log,theme:state.theme},privateContent:state})?.catch(()=>{});}function icons(){$$('button').forEach(b=>b.classList.add('cursor-interaction'));globalThis.lucide?.createIcons({attrs:{width:16,height:16}});}
function names(){const p=data[state.project],v=view();return v.history?[p.files[v.commit%p.files.length]]:v.scope==='staged'?p.staged:p.files;}
function groups(){const p=data[state.project],v=view(),f=names()[v.file]||'';const option=f.includes('Options')||f.includes('theme')||f.includes('preferences');const fn=option?'getOptions':p.fn;const subject=option?'options':'project';let gs=[{kind:'context',a:[`export function ${fn}(id: string) {`,`  const ${subject} = cache.get(id);`],b:[`export function ${fn}(id: string) {`,`  const ${subject} = cache.get(id);`]}, {kind:'modified',a:[`  const policy = "${option?'inline':'reload'}";`],b:[`  const policy = "${option?'split':'preserve'}";`],wordA:option?'inline':'reload',wordB:option?'split':'preserve'}, {kind:'context',a:['',`  const previous = active.get();`],b:['',`  const previous = active.get();`]}, {kind:'deleted',a:['  console.log(previous);'],b:[]}, {kind:'context',a:[''],b:['']}, {kind:'added',a:[],b:['  if (previous) {','    saveViewState(previous.id);','  }']}, {kind:'context',a:['',`  active.set(${subject});`],b:['',`  active.set(${subject});`]}, {kind:'modified',a:[`  return  ${subject};`],b:[`  return ${subject};`],space:true},{kind:'context',a:['}'],b:['}']}];if(v.history){gs[1].a=['  const policy = "default";'];gs[1].b=[`  const policy = "${['preserve','balanced','recent','initial'][v.commit]}";`];gs[1].wordA='default';gs[1].wordB=['preserve','balanced','recent','initial'][v.commit];}if(state.whitespace==='ignore')gs=gs.map(g=>g.space?{...g,kind:'context'}:g);return gs;}
function syntax(text,word){let out='',last=0;const re=/("[^"\n]*"|'[^'\n]*'|\b(?:export|function|const|if|return|string)\b|\b\d+\b|\b[A-Za-z_]\w*(?=\())/g;for(const m of text.matchAll(re)){out+=esc(text.slice(last,m.index));const token=m[0],cls=/^["']/.test(token)?'j-str':/^(export|function|const|if|return|string)$/.test(token)?'j-kw':/^\d/.test(token)?'j-num':'j-fn';let val=esc(token);if(word&&state.highlight==='words'&&token.includes(word))val=val.replace(esc(word),'<mark class="j-word">'+esc(word)+'</mark>');out+=`<span class="${cls}">${val}</span>`;last=m.index+token.length;}return out+esc(text.slice(last));}
function renderTree(){const v=view(),files=names();$('#j-tree').innerHTML=`<div class="j-dir"><i data-lucide="chevron-down"></i><i data-lucide="folder"></i>src / core</div>`+files.map((n,i)=>({n,i})).filter(({n})=>n.toLowerCase().includes(filter.toLowerCase())).map(({n,i})=>`<button class="j-file ${i===v.file?'selected':''}" data-file="${i}"><span class="j-ts">TS</span><span class="j-file-mod">${esc(n)}</span><span class="j-file-status">M</span></button>`).join('');$('#j-file-count').textContent=`${files.length} 个文件`;}
function drawDiff(){const p=data[state.project],v=view(),f=names()[v.file];$('#j-tab-name').textContent=f||'暂无变更';$('#j-left-ref').textContent=v.history?'父提交 · '+['61fb820','4ed92ab','1b632f0','空树'][v.commit]:v.scope==='staged'?'HEAD':'暂存区';$('#j-right-ref').textContent=v.history?'提交 · '+['a7c32e1','61fb820','4ed92ab','1b632f0'][v.commit]:v.scope==='staged'?'暂存区':'工作区 · 本地';$('#j-left-path').textContent='src/core/'+(f||'');$('#j-mode').value=state.mode;$('#j-whitespace').value=state.whitespace;$('#j-highlight').value=state.highlight;

let gs=groups();let l=8,r=8,h=-1,total=gs.filter(g=>g.kind!=='context').length;v.hunk=Math.min(v.hunk,total-1);$('#j-position').textContent=`${v.hunk+1} / ${total}`;$('#j-change-count').textContent=`${total} 处差异`;$('#j-summary').textContent=state.whitespace==='ignore'?'已忽略 1 处空白差异':'2 处修改 · 1 处新增 · 1 处删除';const unified=state.mode==='unified'||narrow;root.querySelector('#j-mode option[value=split]').textContent=narrow?'并排（窄屏统一）':'并排视图';
const line=(t,num,word)=>`<div class="j-code-line"><span class="j-code-text">${syntax(t,word)||' '}</span><span class="j-ln">${num}</span></div>`;let html=`<div class="j-collapse"><button data-context="true">${state.expanded?'− 收起':'＋ 展开'} 7 行未修改内容</button></div>`;
if(state.expanded){const head=["import { cache } from './cache';","import { active } from './active';","import { saveViewState } from './state';",'', '// Project view state','// Keep the current reading position',''];html+=head.map((t,i)=>unified?`<div class="j-unified-row"><span class="j-ln">${i+1}</span><span class="j-ln">${i+1}</span><span class="j-sign"> </span><span class="j-code-text">${syntax(t)}</span></div>`:`<div class="j-block"><div class="j-code-side j-left">${line(t,i+1)}</div><svg class="j-connection" aria-hidden="true"></svg><div class="j-code-side j-right">${line(t,i+1)}</div></div>`).join('');}
gs.forEach(g=>{const changed=g.kind!=='context';if(changed)h++;const active=changed&&h===v.hunk;const numsA=g.a.map(()=>l++),numsB=g.b.map(()=>r++);if(unified){html+=`<div class="j-unified-group ${active?'is-active':''}" ${changed?`data-hunk="${h}"`:''}>`;if(!changed){html+=g.b.map((t,i)=>`<div class="j-unified-row"><span class="j-ln">${numsA[i]||''}</span><span class="j-ln">${numsB[i]}</span><span class="j-sign"> </span><span class="j-code-text">${syntax(t)}</span></div>`).join('');}else{html+=g.a.map((t,i)=>`<div class="j-unified-row j-${g.kind==='modified'?'modified':'deleted'}"><span class="j-ln">${numsA[i]}</span><span class="j-ln"></span><span class="j-sign">−</span><span class="j-code-text">${syntax(t,g.wordA)}</span></div>`).join('');html+=g.b.map((t,i)=>`<div class="j-unified-row j-${g.kind==='modified'?'modified':'added'}"><span class="j-ln"></span><span class="j-ln">${numsB[i]}</span><span class="j-sign">+</span><span class="j-code-text">${syntax(t,g.wordB)}</span></div>`).join('');}html+='</div>';return;}
html+=`<div class="j-block ${active?'is-active':''}" ${changed?`data-hunk="${h}" data-kind="${g.kind}"`:''}><div class="j-code-side j-left ${g.a.length?'j-'+g.kind:'j-blank'}">${g.a.map((t,i)=>line(t,numsA[i],g.wordA)).join('')}</div><svg class="j-connection" preserveAspectRatio="none" aria-hidden="true"></svg><div class="j-code-side j-right ${g.b.length?'j-'+g.kind:'j-blank'}">${g.b.map((t,i)=>line(t,numsB[i],g.wordB)).join('')}</div></div>`;});$('#j-diff').innerHTML=html;$('#j-fold').setAttribute('aria-label',state.expanded?'折叠未修改上下文':'展开未修改上下文');requestAnimationFrame(connect);}
function connect(){$$('.j-block[data-kind]').forEach(el=>{const left=el.querySelector('.j-left'),right=el.querySelector('.j-right'),svg=el.querySelector('svg');const a=left.getBoundingClientRect().height,b=right.getBoundingClientRect().height,H=Math.max(a,b,1);const fill=el.dataset.kind==='modified'?'var(--j-mod)':el.dataset.kind==='added'?'var(--j-add)':'var(--j-del)';svg.setAttribute('viewBox',`0 0 32 ${H}`);svg.innerHTML=`<path d="M0 0 L32 0 L32 ${b} C16 ${b} 16 ${a} 0 ${a} Z" fill="${fill}" stroke="var(--j-border)"/>`;});}
function renderLog(){const p=data[state.project],v=view();$('#j-log').hidden=!state.log;$('#j-log-filter').textContent=v.branch==='all'?'全部分支':'浏览：'+v.branch;$('#j-branch-list').innerHTML=[p.branch,'main','release/0.1'].filter((x,i,a)=>a.indexOf(x)===i).map(b=>`<button data-branch="${esc(b)}" class="${v.branch===b?'selected':''}"><i data-lucide="git-branch"></i>${esc(b)}</button>`).join('');const commits=p.commits.map((text,i)=>({text,i})).filter(({text,i})=>(v.branch==='all'||v.branch===p.branch||i>0)&&(text+' Lin '+['a7c32e1','61fb820','4ed92ab','1b632f0'][i]).toLowerCase().includes(commitFilter.toLowerCase()));$('#j-commits').innerHTML=commits.map(({text,i})=>`<button class="j-commit ${v.commit===i?'selected':''}" data-commit="${i}"><svg class="j-topology" viewBox="0 0 36 31" aria-label="提交拓扑"><path d="M10 0V31${i===1?'M30 0Q30 16 10 16':''}" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="15" r="3" fill="var(--j-bg)" stroke="currentColor" stroke-width="1.5"/></svg><span class="j-commit-message">${i===0?'<span class="j-ref">HEAD</span>':i===1?'<span class="j-ref">main</span>':''}${esc(text)}</span><span class="j-dim">${['10:24','昨天','周一','周日'][i]}</span></button>`).join('')||'<div class="j-group-label">没有匹配的提交</div>';$('#j-commit-details').innerHTML=`<strong>${p.commits[v.commit]}</strong><p>Lin · ${['a7c32e1','61fb820','4ed92ab','1b632f0'][v.commit]}</p><p>1 个变更文件</p><button id="j-open-commit">查看此提交的差异 →</button>`;}
function render(){const p=data[state.project],v=view();root.style.colorScheme=state.theme==='auto'?'light dark':state.theme;root.style.setProperty('--j-code-font',state.font+'px');root.classList.toggle('focused',state.focus);$('#j-project-name').textContent=p.name;$('#j-current-branch').textContent=p.branch;$$('[data-project]').forEach(b=>b.classList.toggle('selected',Number(b.dataset.project)===state.project));$$('[data-scope]').forEach(b=>b.classList.toggle('selected',b.dataset.scope===v.scope&&!v.history));const fs=names();if(v.file>=fs.length||v.file<0)v.file=0;$('#j-status-scope').textContent=v.history?'提交记录 → 提交差异':v.scope==='staged'?'HEAD → 暂存区':'暂存区 → 工作区';renderTree();drawDiff();renderLog();icons();}
function changeProject(i){state.project=i;filter='';commitFilter='';$('#j-file-search').value='';$('#j-commit-search').value='';$('#j-picker').hidden=true;render();save();}
function picker(){const q=$('#j-project-search').value.toLowerCase();$('#j-project-results').innerHTML=data.map((p,i)=>({p,i})).filter(({p})=>(p.name+p.path).toLowerCase().includes(q)).map(({p,i})=>`<button class="j-picker-item" data-project="${i}"><span class="j-project-dot">${p.name[0]}</span><span>${p.name}<small>${p.path}</small></span></button>`).join('')||'<div class="j-group-label">没有匹配的项目</div>';icons();}function openPicker(){$('#j-picker').hidden=false;$('#j-project-search').value='';picker();$('#j-project-search').focus();}function closePicker(){$('#j-picker').hidden=true;$('#j-project-picker').focus();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const v=view();if(b.dataset.project!==undefined){changeProject(Number(b.dataset.project));return;}if(b.dataset.scope){v.scope=b.dataset.scope;v.history=false;v.file=0;v.hunk=0;}else if(b.dataset.file!==undefined){v.file=Number(b.dataset.file);v.hunk=0;}else if(b.dataset.branch){v.branch=b.dataset.branch;v.commit=b.dataset.branch===data[state.project].branch?0:1;}else if(b.dataset.commit!==undefined){v.commit=Number(b.dataset.commit);v.history=true;if(v.history){v.file=0;v.hunk=0;}}else if(b.dataset.context){state.expanded=!state.expanded;}else switch(b.id){case'j-project-picker':openPicker();return;case'j-picker-close':closePicker();return;case'j-focus':case'j-collapse-side':state.focus=!state.focus;break;case'j-changes-icon':state.focus=false;v.history=false;break;case'j-log-icon':case'j-status-log':state.log=!state.log;break;case'j-hide-log':state.log=false;break;case'j-all-branches':v.branch='all';break;case'j-open-commit':v.history=true;v.file=0;v.hunk=0;break;case'j-fold':state.expanded=!state.expanded;break;case'j-prev':case'j-next':{const total=groups().filter(g=>g.kind!=='context').length;v.hunk=(v.hunk+(b.id==='j-prev'?-1:1)+total)%total;break;}default:return;}render();save();});
[['j-mode','mode'],['j-whitespace','whitespace'],['j-highlight','highlight']].forEach(([id,k])=>$('#'+id).addEventListener('change',e=>{state[k]=e.target.value;view().hunk=0;drawDiff();save();}));$('#j-file-search').addEventListener('input',e=>{filter=e.target.value;renderTree();icons();});$('#j-commit-search').addEventListener('input',e=>{commitFilter=e.target.value;renderLog();icons();});$('#j-project-search').addEventListener('input',picker);$('#j-picker').addEventListener('click',e=>{if(e.target===$('#j-picker'))closePicker();});root.addEventListener('keydown',e=>{if(e.key==='F7'){e.preventDefault();$(e.shiftKey?'#j-prev':'#j-next').click();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPicker();}if(e.key==='Escape'&&!$('#j-picker').hidden)closePicker();if(e.key==='Tab'&&!$('#j-picker').hidden){const a=[...$('#j-picker').querySelectorAll('input,button')];if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus();}}});window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState?.privateContent);render();});const resize=new ResizeObserver(entries=>{const next=entries[0].contentRect.width<480;if(next!==narrow){narrow=next;drawDiff();}else connect();});resize.observe(root);render();if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{render();save();}});t.addSelect(state,'theme',{label:'界面主题',options:[{label:'跟随系统',value:'auto'},{label:'JetBrains 浅色',value:'light'},{label:'JetBrains 深色',value:'dark'}]});t.addSlider(state,'font',{label:'代码字号',min:11,max:15,unit:'px'});t.addToggle(state,'focus',{label:'专注 Diff，收起文件树'});t.addToggle(state,'log',{label:'显示底部 Git Log'});}
